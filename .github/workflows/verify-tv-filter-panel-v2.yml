name: Verify TV filter panel v2

on:
  push:
    branches:
      - fix/tv-filter-panel-v2

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/tv-filter-panel-v2

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: visionflix-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Mobile regression guard
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace

      - name: Build TV
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Verlezza-Vision-TV-filter-panel-v2.apk

      - name: Verify TV package and signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Verlezza-Vision-TV-filter-panel-v2.apk | tee /tmp/signature.txt
          CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/signature.txt | sort -u)"
          test "$CERT" = "55d9c2dc94f32e6b7685994f2652eec3d8086432e9de94e0645a8bf30f41918e"
          "$BUILD_TOOLS/aapt" dump badging /tmp/Verlezza-Vision-TV-filter-panel-v2.apk | tee /tmp/badging.txt
          grep -F "package: name='com.br174.visionflix.tv.debug'" /tmp/badging.txt
          grep -F "com.streamflixreborn.streamflix.activities.main.MainTvActivity" /tmp/badging.txt
          grep -F "application-label:'Verlezza Vision'" /tmp/badging.txt

      - name: Upload TV test artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-filter-panel-v2-verified
          path: /tmp/Verlezza-Vision-TV-filter-panel-v2.apk
          if-no-files-found: error
