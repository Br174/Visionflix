name: Apply TV filter panel v2 patch

on:
  push:
    branches:
      - fix/tv-filter-panel-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/tv-filter-panel-v2

      - name: Apply patch
        run: python3 scripts/apply_tv_filter_panel_v2.py

      - name: Guard TV-only UI surface
        shell: bash
        run: |
          set -euo pipefail
          git diff -- app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt \
                    app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchViewModel.kt \
                    app/src/main/java/com/streamflixreborn/streamflix/providers/AdvancedSearch.kt \
                    app/src/main/java/com/streamflixreborn/streamflix/adapters/AppAdapter.kt \
                    app/src/main/java/com/streamflixreborn/streamflix/adapters/viewholders/PeopleViewHolder.kt
          test -z "$(git diff --name-only | grep -E 'MobileFragment|mobile\.xml|MainTvActivity|activity_main_tv' || true)"

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchViewModel.kt \
            app/src/main/java/com/streamflixreborn/streamflix/providers/AdvancedSearch.kt \
            app/src/main/java/com/streamflixreborn/streamflix/adapters/AppAdapter.kt \
            app/src/main/java/com/streamflixreborn/streamflix/adapters/viewholders/PeopleViewHolder.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat: TV retractable advanced filters and people selectors'
          git push origin HEAD:fix/tv-filter-panel-v2
