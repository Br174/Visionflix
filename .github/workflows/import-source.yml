name: Import Streamflix BV into private repo

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source branch
        run: |
          git clone --depth 1 --branch feature/advanced-search-filters https://github.com/Br174/streamflix-BV.git /tmp/visionflix-source

      - name: Replace private repository contents
        run: |
          rsync -a --delete --exclude='.git' /tmp/visionflix-source/ ./

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import"
          else
            git commit -m "Import Streamflix BV project with Android and Android TV advanced search"
            git push origin main
          fi
