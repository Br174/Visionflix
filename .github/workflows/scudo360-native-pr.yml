name: Scudo360 Verlezza Vision native PR gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.motorlab/scudo360-contracts.json'
      - '.motorlab/regression/**'
      - '.github/workflows/build-apks.yml'
      - '.github/workflows/scudo360-native-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scudo360-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
      - name: Configure JVM test environment
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          chmod +x ./gradlew
      - name: Test each critical search-filter contract
        run: node .motorlab/regression/scudo360-gate.mjs .motorlab/scudo360-contracts.json promotion .motorlab/scudo360-report.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scudo360-vision-pr-${{ github.run_id }}
          path: |
            .motorlab/scudo360-report.json
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
