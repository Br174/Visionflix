name: Apply TV dropdown and scroll patch

on:
  push:
    branches:
      - fix/tv-filter-focus-scroll
    paths:
      - scripts/patch_tv_search_dropdown_scroll.py
      - .github/workflows/apply-tv-dropdown-scroll-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-filter-focus-scroll
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/patch_tv_search_dropdown_scroll.py

      - name: Verify crash-safe shell is still present
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt'
          grep -F 'R.layout.fragment_search_tv_safe' "$FILE"
          grep -F 'buildAdvancedFiltersSafely()' "$FILE"
          grep -F 'Database/ViewModel, filtri e voce NON devono tornare nel percorso di inflation.' "$FILE"
          grep -F 'Spinner(requireContext(), Spinner.MODE_DROPDOWN)' "$FILE"
          grep -F 'val target = (searchHeaderOffset + dy).coerceIn(0, maxOffset)' "$FILE"
          ! grep -F 'AlertDialog.Builder' "$FILE"

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt
          git commit -m 'fix: use Mobile-style TV dropdowns and natural filter scrolling'
          git push origin HEAD:fix/tv-filter-focus-scroll
