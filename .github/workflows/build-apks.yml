name: UAB-CORE Visionflix Mobile and TV adapter

on:
  push:
    branches:
      - main
      - 'lab/**'
      - 'candidate/**'
      - 'mother/**'
    paths-ignore:
      - '.uab/**'
      - '.motorlab/**'
      - 'MOTORLAB_PROJECT_HOOK.txt'
      - '.github/workflows/build-apks.yml'
      - '.github/workflows/publish-tv-lab149.yml'
      - '.github/workflows/publish-tv-lab150.yml'
      - '.github/signing/**'
  workflow_dispatch:

permissions:
  contents: write

# Keep one active LAB build per branch. A later validated change supersedes obsolete builds.
concurrency:
  group: visionflix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/lab/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Progress 5% - accepted
        run: echo "[UAB_PROGRESS=5] Visionflix adapter preso in carico"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect UAB lifecycle stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            mother/*) UAB_STAGE="MADRE" ;;
            candidate/*) UAB_STAGE="CANDIDATA" ;;
            lab/*) UAB_STAGE="LAB" ;;
            *) UAB_STAGE="BASE" ;;
          esac
          echo "UAB_STAGE=$UAB_STAGE" >> "$GITHUB_ENV"
          echo "stage=$UAB_STAGE" >> "$GITHUB_OUTPUT"
          echo "[UAB_PROGRESS=15] Stage=$UAB_STAGE; pubblicazione permanente consentita solo a MADRE"

      - name: Run LAB signing policy regression checks
        if: steps.stage.outputs.stage == 'LAB'
        shell: bash
        run: bash .github/scripts/check-visionflix-signing-lab.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle persistent cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Resolve safe Android version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$UAB_STAGE" = "LAB" ]; then
            # LAB version is monotonic without relying on the public release API.
            APP_VERSION_CODE=$((186 + GITHUB_RUN_NUMBER))
          else
            LATEST_TAG="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --location \
              'https://api.github.com/repos/Br174/streamflix-BV/releases/latest' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
            LATEST_CODE="${LATEST_TAG##*-}"
            case "$LATEST_CODE" in
              ''|*[!0-9]*) echo "::error::Versione pubblica non valida: $LATEST_TAG"; exit 1 ;;
            esac
            APP_VERSION_CODE=$((LATEST_CODE + 1))
          fi
          APP_VERSION_NAME="1.7.$((APP_VERSION_CODE + 71))"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Build $APP_VERSION_CODE ($APP_VERSION_NAME) - stage $UAB_STAGE"

      - name: Restore permanent signing identity (fail closed)
        shell: bash
        env:
          VISIONFLIX_SIGNING_SECRET: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${VISIONFLIX_SIGNING_SECRET:-}" ]; then
            echo "::error::Manca VISIONFLIX_SIGNING_V1_PASSWORD. Nessun APK viene compilato o firmato."
            exit 72
          fi
          umask 077
          KEY_DIR="$RUNNER_TEMP/visionflix-signing"
          mkdir -p "$KEY_DIR"
          base64 --decode .github/signing/Visionflix_Signing_Key_V1.p12.enc.b64 > "$KEY_DIR/key.p12.enc"
          echo "fb15a0054401ca7b8f925977a51e0585965ef5edfb4cca3d00a3d92550526799  $KEY_DIR/key.p12.enc" | sha256sum --check -
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$KEY_DIR/key.p12.enc" -out "$KEY_DIR/visionflix-v1.p12" \
            -pass env:VISIONFLIX_SIGNING_SECRET
          keytool -exportcert -storetype PKCS12 -keystore "$KEY_DIR/visionflix-v1.p12" \
            -storepass "$VISIONFLIX_SIGNING_SECRET" -alias visionflix-v1 \
            -file "$KEY_DIR/signing-cert.der" >/dev/null
          echo "ae10b6198ccb567386af37ad8b92d9ad40aa5bada469b8528811d447fc9612f6  $KEY_DIR/signing-cert.der" | sha256sum --check -
          echo "VISIONFLIX_SIGNING_KEYSTORE=$KEY_DIR/visionflix-v1.p12" >> "$GITHUB_ENV"
          echo "VISIONFLIX_SIGNING_MODE=permanent-v1" >> "$GITHUB_ENV"
          printf "permanent-v1\n" > /tmp/signing-mode.txt
          echo "[UAB_PROGRESS=45] Identita firma V1 permanente verificata; nessuna cache o fallback effimero"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Progress 60% - cache and toolchain ready
        run: echo "[UAB_PROGRESS=60] Cache Gradle e toolchain pronte"

      - name: LAB150 filter matrix unit tests
        if: github.ref == 'refs/heads/lab/visionflix-lab150-recovery-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab150AdvancedFiltersTest' --stacktrace
          echo "[LAB150_TESTS=PASS] Genre combinations, title-free filters and criteria matrix"

      - name: LAB151 country, genre and search-filter regression tests
        if: github.ref == 'refs/heads/lab/visionflix-lab151-search-country-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab150AdvancedFiltersTest' --tests '*Lab151CountryAndGenreTest' --stacktrace
          echo "[LAB151_TESTS=PASS] 21 country selections, genre mappings and filter combinations"

      - name: LAB152 poster wall and filter regression tests
        if: github.ref == 'refs/heads/lab/visionflix-lab152-global-wall-provider-links-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab150AdvancedFiltersTest' --tests '*Lab151CountryAndGenreTest' --tests '*Lab152GlobalCatalogTest' --stacktrace
          echo "[LAB152_TESTS=PASS] Unified catalog, country and genres"

      - name: LAB153 TV remote, country, catalog and sorting regression tests
        if: github.ref == 'refs/heads/lab/visionflix-lab153-sticky-filter-fast-global-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab150AdvancedFiltersTest' --tests '*Lab151CountryAndGenreTest' --tests '*Lab152GlobalCatalogTest' --tests '*Lab153NavigationTest' --stacktrace
          echo "[LAB153_TESTS=PASS] Native poster-row shortcuts, source priority, catalog and filters"

      - name: LAB154 TV remote, country, catalog and sorting regression tests
        if: github.ref == 'refs/heads/lab/visionflix-lab154-compact-header-grid-fast-filters-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab150AdvancedFiltersTest' --tests '*Lab151CountryAndGenreTest' --tests '*Lab152GlobalCatalogTest' --tests '*Lab153NavigationTest' --tests '*Lab154SearchPacingTest' --stacktrace
          echo "[LAB154_TESTS=PASS] Fast first filtered results, progressive coverage and preserved poster navigation"

      - name: LAB155 Cerca entry and HTTP451 crash regression tests
        if: github.ref == 'refs/heads/lab/visionflix-lab155-http451-search-recovery-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab150AdvancedFiltersTest' --tests '*Lab151CountryAndGenreTest' --tests '*Lab152GlobalCatalogTest' --tests '*Lab153NavigationTest' --tests '*Lab154SearchPacingTest' --tests '*Lab155SearchSafetyTest' --stacktrace
          echo "[LAB155_TESTS=PASS] HTTP451 provider guard, safe screen re-entry, existing TV filter regressions"

      - name: LAB156 unified filter focus and sorting regression tests
        if: github.ref == 'refs/heads/lab/visionflix-lab156-filter-focus-unified-sort-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab150AdvancedFiltersTest' --tests '*Lab151CountryAndGenreTest' --tests '*Lab152GlobalCatalogTest' --tests '*Lab153NavigationTest' --tests '*Lab154SearchPacingTest' --tests '*Lab155SearchSafetyTest' --tests '*Lab156UnifiedSortTest' --stacktrace
          echo "[LAB156_TESTS=PASS] One-sort menu and circle focus with preserved TV search regressions"

      - name: LAB157 remote focus and compact filter regression tests
        if: github.ref == 'refs/heads/lab/visionflix-lab157-focus-compact-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab153NavigationTest' --tests '*Lab155SearchSafetyTest' --tests '*Lab156UnifiedSortTest' --tests '*Lab157FocusPolicyTest' --stacktrace
          echo "[LAB157_TESTS=PASS] Existing remote/search regressions and deferred-focus guard"

      - name: LAB158 director-first cast and verified filmography regressions
        if: github.ref == 'refs/heads/lab/visionflix-lab158-director-first-filmography-20261024'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew :app:testDebugUnitTest --tests '*Lab153NavigationTest' --tests '*Lab155SearchSafetyTest' --tests '*Lab156UnifiedSortTest' --tests '*Lab157FocusPolicyTest' --tests '*DirectorCreditsTest' --stacktrace
          echo "[LAB158_TESTS=PASS] Director-role credits, cast order, no duplicates, focus and search regressions"

      - name: Build Android mobile debug APK
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --build-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Verlezza-Vision-Mobile.apk

      - name: Build Android TV debug APK
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --build-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Verlezza-Vision-TV.apk
          cp /tmp/Verlezza-Vision-TV.apk /tmp/Visionflix_BV_TV.apk
          echo "[UAB_PROGRESS=75] Build Mobile e TV completate"

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Visionflix_BV_TV.apk | tee /tmp/signature-info.txt
          VV_CERTIFICATES="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/signature-info.txt | sort -u)"
          test "${VV_CERTIFICATES}" = "ae10b6198ccb567386af37ad8b92d9ad40aa5bada469b8528811d447fc9612f6"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Verlezza-Vision-Mobile.apk | tee /tmp/mobile-signature-info.txt
          MOBILE_CERTIFICATES="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/mobile-signature-info.txt | sort -u)"
          test "$MOBILE_CERTIFICATES" = "$VV_CERTIFICATES"
          test "${VISIONFLIX_SIGNING_MODE:-}" = "permanent-v1"
          "$BUILD_TOOLS/aapt" dump badging /tmp/Visionflix_BV_TV.apk > /tmp/apk-info.txt
          grep -F "package: name='com.br174.visionflix.tv.debug'" /tmp/apk-info.txt
          grep -F "com.streamflixreborn.streamflix.activities.main.MainTvActivity" /tmp/apk-info.txt
          grep -F "versionCode='$APP_VERSION_CODE'" /tmp/apk-info.txt
          grep -F "application-label:'Verlezza Vision'" /tmp/apk-info.txt
          sha256sum /tmp/Visionflix_BV_TV.apk | sed 's#/tmp/##' > /tmp/SHA256SUMS.txt
          echo "[UAB_PROGRESS=85] Firma, package, versione, launcher e checksum verificati"

      - name: Bundle signed LAB APKs with integrity proofs
        if: steps.stage.outputs.stage == 'LAB'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/Verlezza-Vision-TV.apk /tmp/Verlezza-Vision-Mobile.apk \
            | sed 's#/tmp/##' > /tmp/LAB-APK-SHA256SUMS.txt
          cd /tmp
          zip -q -j Verlezza-Vision-LAB.zip \
            Verlezza-Vision-TV.apk Verlezza-Vision-Mobile.apk \
            LAB-APK-SHA256SUMS.txt apk-info.txt signature-info.txt \
            mobile-signature-info.txt signing-mode.txt
          unzip -t -q /tmp/Verlezza-Vision-LAB.zip
          test -s /tmp/Verlezza-Vision-LAB.zip

      - name: Upload temporary build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Verlezza-Vision-${{ steps.stage.outputs.stage }}-${{ github.run_number }}
          path: |
            /tmp/Verlezza-Vision-Mobile.apk
            /tmp/Verlezza-Vision-TV.apk
            /tmp/SHA256SUMS.txt
            /tmp/apk-info.txt
            /tmp/signature-info.txt
            /tmp/mobile-signature-info.txt
            /tmp/signing-mode.txt
            /tmp/LAB-APK-SHA256SUMS.txt
            /tmp/Verlezza-Vision-LAB.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish authorized LAB prerelease automatically
        if: steps.stage.outputs.stage == 'LAB' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Opt-in is versioned in LAB branches only, so no unapproved branches publish.
          if [ ! -f .motorlab/LAB_AUTOPUBLISH_POLICY.txt ]; then
            echo "No LAB automatic-publication policy found in this branch. No publication."
            exit 0
          fi
          grep -Fxq 'AUTO_PUBLISH_VERIFIED_LAB=true' .motorlab/LAB_AUTOPUBLISH_POLICY.txt
          grep -Fxq 'PROMOTE_MADRE=false' .motorlab/LAB_AUTOPUBLISH_POLICY.txt
          case "$GITHUB_REF_NAME" in
            lab/visionflix-*) ;;
            *) echo "::error::LAB autodelivery restricted to Visionflix namespaced branches"; exit 74 ;;
          esac
          test "${VISIONFLIX_SIGNING_MODE:-}" = "permanent-v1"
          test -s /tmp/Verlezza-Vision-TV.apk
          test -s /tmp/Verlezza-Vision-Mobile.apk
          test -s /tmp/Verlezza-Vision-LAB.zip
          test -s /tmp/signature-info.txt
          grep -Fq "ae10b6198ccb567386af37ad8b92d9ad40aa5bada469b8528811d447fc9612f6" /tmp/signature-info.txt
          tag="visionflix-lab-ci-${GITHUB_RUN_ID}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Immutable LAB release tag already exists; refusing overwrite."
            exit 75
          fi
          cat > "$RUNNER_TEMP/visionflix-lab-release.md" <<EOF
          Verlezza Vision LAB verification-only build $APP_VERSION_NAME ($APP_VERSION_CODE).
          Branch: $GITHUB_REF_NAME.
          Source commit: $GITHUB_SHA.
          Successful GitHub Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Signing certificate SHA-256: ae10b6198ccb567386af37ad8b92d9ad40aa5bada469b8528811d447fc9612f6.
          TV APK SHA-256: $(sha256sum /tmp/Verlezza-Vision-TV.apk | awk '{print $1}')
          Mobile APK SHA-256: $(sha256sum /tmp/Verlezza-Vision-Mobile.apk | awk '{print $1}')
          TEST ONLY. The original signing identity differs from older pre-V1 installations.
          No mutation of main, MADRE, Downloader codes or production.
          EOF
          # GitHub's restricted workflow token may not create a release tag pointing
          # directly to a LAB commit that modifies .github/workflows/.
          # Tag is only a distribution anchor; release notes pin the exact tested LAB SHA.
          gh release create "$tag" \
            /tmp/Verlezza-Vision-TV.apk#Verlezza-Vision-TV-LAB.apk \
            /tmp/Verlezza-Vision-Mobile.apk#Verlezza-Vision-Mobile-LAB.apk \
            /tmp/Verlezza-Vision-LAB.zip#Verlezza-Vision-LAB.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "main" \
            --title "Verlezza Vision LAB - $APP_VERSION_NAME (build $APP_VERSION_CODE)" \
            --notes-file "$RUNNER_TEMP/visionflix-lab-release.md" \
            --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '{tag_name, prerelease, draft, assets: [.assets[].name]}' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable private MADRE release
        if: steps.stage.outputs.stage == 'MADRE'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="visionflix-madre-${APP_VERSION_CODE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La MADRE $TAG esiste già ed è immutabile."
            exit 41
          fi
          cat > /tmp/private-release-notes.md <<EOF
          Verlezza Vision MADRE ${APP_VERSION_NAME} (build ${APP_VERSION_CODE}).
          UAB-CORE-V1: release immutabile promossa dal ramo $GITHUB_REF_NAME.
          Source commit: $GITHUB_SHA
          EOF
          gh release create "$TAG" \
            /tmp/Verlezza-Vision-Mobile.apk \
            /tmp/Verlezza-Vision-TV.apk \
            /tmp/Visionflix_BV_TV.apk \
            /tmp/SHA256SUMS.txt \
            /tmp/apk-info.txt \
            /tmp/signature-info.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Verlezza Vision MADRE — ${APP_VERSION_NAME} (build ${APP_VERSION_CODE})" \
            --notes-file /tmp/private-release-notes.md \
            --latest

      - name: Publish immutable Downloader MADRE release
        if: steps.stage.outputs.stage == 'MADRE'
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLIC_REPO: Br174/streamflix-BV
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PUBLISH_TOKEN non configurato."
            exit 1
          fi
          TAG="verlezza-tv-${APP_VERSION_CODE}"
          TITLE="Verlezza Vision TV — ${APP_VERSION_NAME} (build ${APP_VERSION_CODE})"
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "::error::La release pubblica $TAG esiste già ed è immutabile."
            exit 42
          fi
          cat > /tmp/release-notes.md <<EOF
          Verlezza Vision TV ${APP_VERSION_NAME} (build ${APP_VERSION_CODE}).

          Codice Downloader: **3875230**.
          Il file resta Visionflix_BV_TV.apk; il puntatore /releases/latest/ segue la nuova MADRE senza cancellare le MADRI precedenti.
          Firma stabile dalla build 168.
          UAB-CORE-V1 source commit: $GITHUB_SHA
          EOF
          gh release create "$TAG" \
            /tmp/Visionflix_BV_TV.apk \
            /tmp/SHA256SUMS.txt \
            /tmp/apk-info.txt \
            /tmp/signature-info.txt \
            --repo "$PUBLIC_REPO" \
            --target main \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Verify Downloader 3875230 serves promoted MADRE
        if: steps.stage.outputs.stage == 'MADRE'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(awk '{print $1}' /tmp/SHA256SUMS.txt)"
          VERIFIED=0
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/public-download.apk
            if curl --fail --location --retry 2 --max-time 120 \
              'https://github.com/Br174/streamflix-BV/releases/latest/download/Visionflix_BV_TV.apk' \
              --output /tmp/public-download.apk; then
              ACTUAL_SHA="$(sha256sum /tmp/public-download.apk | awk '{print $1}')"
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                VERIFIED=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$VERIFIED" != "1" ]; then
            echo "::error::Downloader 3875230 non serve ancora la MADRE appena promossa."
            exit 1
          fi
          echo "Downloader 3875230 verificato sulla MADRE ${APP_VERSION_NAME}." >> "$GITHUB_STEP_SUMMARY"

      - name: Progress 95% - handoff or promotion complete
        shell: bash
        run: |
          if [ "$UAB_STAGE" = "MADRE" ]; then
            echo "[UAB_PROGRESS=95] MADRE immutabile pubblicata e puntatore Downloader aggiornato"
          else
            echo "[UAB_PROGRESS=95] Artefatto temporaneo $UAB_STAGE pronto; nessuna Release permanente modificata"
          fi

      - name: Progress 100% - complete
        shell: bash
        run: echo "[UAB_PROGRESS=100] Visionflix UAB-CORE-V1 completato per stage $UAB_STAGE"
