name: Build Visionflix Mobile and TV APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: visionflix-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950
          fi
          test -f "$HOME/.android/debug.keystore"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Android mobile debug APK
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Visionflix-Mobile-debug.apk

      - name: Build Android TV debug APK
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Verlezza-Vision-TV-latest.apk

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visionflix-debug-APKs
          path: |
            /tmp/Visionflix-Mobile-debug.apk
            /tmp/Verlezza-Vision-TV-latest.apk
          if-no-files-found: error

      - name: Publish/update fixed latest TV release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: Verlezza Vision TV - Latest
          prerelease: false
          make_latest: true
          files: /tmp/Verlezza-Vision-TV-latest.apk
          overwrite_files: true
          body: |
            Download fisso della versione Android TV più recente di Verlezza Vision.
            Ogni build di main sostituisce automaticamente l'APK allegato a questa release.
