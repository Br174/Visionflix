      - name: LAB168 Streamflix-fast filters and protected photo/player regressions
        if: github.ref == 'refs/heads/lab/visionflix-lab168-streamflix-fast-search-20261026'
        env:
          VISIONFLIX_SIGNING_V1_PASSWORD: ${{ secrets.VISIONFLIX_SIGNING_V1_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/check-fixed-lab-downloader-config.sh
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/com/streamflixreborn/streamflix/fragments/search')
          vm = (root / 'SearchViewModel.kt').read_text()
          tv = (root / 'SearchTvFragment.kt').read_text()
          assert 'fun searchActors(' in vm and 'fun searchDirectors(' in vm
          assert 'private fun selectActor(' in tv and 'private fun selectDirector(' in tv
