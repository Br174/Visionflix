name: Build Visionflix Mobile and TV APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: visionflix-debug-keystore-v1

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Android mobile debug APK
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Visionflix-Mobile-debug.apk

      - name: Build Android TV debug APK
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Visionflix-TV-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Visionflix-debug-APKs
          path: |
            /tmp/Visionflix-Mobile-debug.apk
            /tmp/Visionflix-TV-debug.apk
          if-no-files-found: error
