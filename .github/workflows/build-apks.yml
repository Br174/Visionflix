      - name: Verify published MADRE GitHub URL and checksum (not numeric Downloader code)
        if: steps.stage.outputs.stage == 'MADRE'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(awk '{print $1}' /tmp/SHA256SUMS.txt)"
          VERIFIED=0
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/public-download.apk
            if curl --fail --location --retry 2 --max-time 120 \
              'https://github.com/Br174/streamflix-BV/releases/latest/download/Visionflix_BV_TV.apk' \
              --output /tmp/public-download.apk; then
              ACTUAL_SHA="$(sha256sum /tmp/public-download.apk | awk '{print $1}')"
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                VERIFIED=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$VERIFIED" != "1" ]; then
            echo "::error::Il link GitHub MADRE non serve ancora l\x27APK appena promosso."
            exit 1
          fi
          echo "URL GitHub MADRE verificata sulla build ${APP_VERSION_NAME}. Codice AFTVnews 6920196: destinazione da verificare indipendentemente." >> "$GITHUB_STEP_SUMMARY"

      - name: Progress 95% - handoff or promotion complete
        shell: bash
        run: |
          if [ "$UAB_STAGE" = "MADRE" ]; then
            echo "[UAB_PROGRESS=95] MADRE immutabile pubblicata e puntatore Downloader aggiornato"
          else
            echo "[UAB_PROGRESS=95] Artefatto temporaneo $UAB_STAGE pronto; nessuna Release permanente modificata"
          fi

      - name: Progress 100% - complete
        shell: bash
        run: echo "[UAB_PROGRESS=100] Visionflix UAB-CORE-V1 completato per stage $UAB_STAGE"

  # Independent last stage: only after signed APK build and immutable LAB prerelease.
  # Cross-branch one-writer lock prevents races between LAB versions.
  publish_fixed_lab_downloader:
    name: Update fixed LAB Downloader link (no main or MADRE changes)
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/lab/visionflix-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: visionflix-lab-fixed-downloader-channel
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout verified LAB branch
        uses: actions/checkout@v4

      - name: Check signed opt-in and script syntax
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .motorlab/LAB_FIXED_DOWNLOADER_POLICY_V1.txt ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -Fxq 'AUTO_UPDATE_FIXED_LAB_URL=true' .motorlab/LAB_FIXED_DOWNLOADER_POLICY_V1.txt
          grep -Fxq 'PROMOTE_MAIN_MADRE_PRODUCTION=false' .motorlab/LAB_FIXED_DOWNLOADER_POLICY_V1.txt
          grep -Fxq 'PROTECTED_OLD_CODES=3875230,4768904,3938567' .motorlab/LAB_FIXED_DOWNLOADER_POLICY_V1.txt
          grep -Fxq 'PREFERRED_USER_CODE=6920196' .motorlab/LAB_FIXED_DOWNLOADER_POLICY_V1.txt
          grep -Fxq 'PREFERRED_USER_CODE_EXPECTED_URL=https://github.com/Br174/Visionflix/releases/download/visionflix-lab-current/Verlezza-Vision-TV.apk' .motorlab/LAB_FIXED_DOWNLOADER_POLICY_V1.txt
          grep -Fxq 'AFTVNEWS_CODE_MAPPING_STATUS=UNVERIFIED' .motorlab/LAB_FIXED_DOWNLOADER_POLICY_V1.txt
          grep -Fxq 'AUTO_PUBLISH_VERIFIED_LAB=true' .motorlab/LAB_AUTOPUBLISH_POLICY.txt
          bash -n .github/scripts/publish-fixed-lab-downloader.sh
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Download THIS build's verified APKs and checksums
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Verlezza-Vision-LAB-${{ github.run_number }}
          path: ${{ runner.temp }}/lab-channel-input

      - name: Promote newer signed LAB APK to unchanged public URL
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ runner.temp }}/lab-channel-input
        run: |
          bash .github/scripts/publish-fixed-lab-downloader.sh
          echo 'LAB URL GitHub verificata dal publisher; codice AFTVnews 6920196 da verificare separatamente tramite destinazione effettiva.' >> "$GITHUB_STEP_SUMMARY"

