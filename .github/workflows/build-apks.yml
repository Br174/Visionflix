name: Build Verlezza Vision Mobile and TV APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Force next globally installable app version
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG="$(curl --fail --silent --show-error --location \
            'https://api.github.com/repos/Br174/streamflix-BV/releases/latest' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          LATEST_CODE="${LATEST_TAG##*-}"
          case "$LATEST_CODE" in
            ''|*[!0-9]*)
              echo "::error::Impossibile ricavare il versionCode dall'ultima release pubblica: $LATEST_TAG"
              exit 1
              ;;
          esac
          APP_VERSION_CODE=$((LATEST_CODE + 1))
          APP_VERSION_NAME="1.7.$((APP_VERSION_CODE + 71))"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Versione forzata: $APP_VERSION_NAME (build $APP_VERSION_CODE), successiva a $LATEST_TAG."

      - name: Restore stable debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: visionflix-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Pin the existing signing key and check its public certificate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file /tmp/signing-cert.der
          echo "55d9c2dc94f32e6b7685994f2652eec3d8086432e9de94e0645a8bf30f41918e  /tmp/signing-cert.der" | sha256sum --check -
          echo "VISIONFLIX_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Android mobile debug APK
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Verlezza-Vision-Mobile.apk

      - name: Build Android TV debug APK
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Verlezza-Vision-TV.apk
          cp /tmp/Verlezza-Vision-TV.apk /tmp/Visionflix_BV_TV.apk

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Visionflix_BV_TV.apk | tee /tmp/signature-info.txt
          VV_CERTIFICATES="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/signature-info.txt | sort -u)"
          test "$VV_CERTIFICATES" = "55d9c2dc94f32e6b7685994f2652eec3d8086432e9de94e0645a8bf30f41918e"
          "$BUILD_TOOLS/aapt" dump badging /tmp/Visionflix_BV_TV.apk > /tmp/apk-info.txt
          grep -F "package: name='com.br174.visionflix.tv.debug'" /tmp/apk-info.txt
          grep -F "com.streamflixreborn.streamflix.activities.main.MainTvActivity" /tmp/apk-info.txt
          grep -F "versionCode='$APP_VERSION_CODE'" /tmp/apk-info.txt
          grep -F "application-label:'Verlezza Vision'" /tmp/apk-info.txt
          sha256sum /tmp/Visionflix_BV_TV.apk | sed 's#/tmp/##' > /tmp/SHA256SUMS.txt

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: Verlezza-Vision-debug-APKs
          path: |
            /tmp/Verlezza-Vision-Mobile.apk
            /tmp/Verlezza-Vision-TV.apk
          if-no-files-found: error

      - name: Publish fixed latest TV release in source repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: Verlezza Vision TV - Latest
          prerelease: false
          make_latest: true
          files: /tmp/Visionflix_BV_TV.apk
          overwrite_files: true
          body: |
            Verlezza Vision TV ${{ env.APP_VERSION_NAME }} (build ${{ env.APP_VERSION_CODE }}).
            Questa release privata viene aggiornata automaticamente a ogni build di main.

      - name: Force public Downloader release to the new TV APK
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLIC_REPO: Br174/streamflix-BV
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PUBLISH_TOKEN non configurato: la build non puo essere considerata pronta finche Downloader non viene aggiornato."
            exit 1
          fi

          TAG="verlezza-tv-${APP_VERSION_CODE}"
          TITLE="Verlezza Vision TV — ${APP_VERSION_NAME} (build ${APP_VERSION_CODE})"

          cat > /tmp/release-notes.md <<EOF
          Verlezza Vision TV ${APP_VERSION_NAME} (build ${APP_VERSION_CODE}).

          Codice Downloader: **3875230**.
          Questo asset alimenta il collegamento stabile registrato nel codice Downloader 3875230.
          Il nome pubblico dell'asset resta Visionflix_BV_TV.apk per mantenere invariato il codice Downloader.

          Firma stabilizzata dalla versione 1.7.239 (build 168). Le precedenti build usavano chiavi temporanee diverse: questo APK non puo aggiornare direttamente quelle installazioni. La rimozione della vecchia app puo cancellarne i dati; salvare prima le impostazioni.
          EOF

          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              /tmp/Visionflix_BV_TV.apk \
              /tmp/SHA256SUMS.txt \
              /tmp/apk-info.txt \
              --repo "$PUBLIC_REPO" \
              --clobber
            gh release edit "$TAG" \
              --repo "$PUBLIC_REPO" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create "$TAG" \
              /tmp/Visionflix_BV_TV.apk \
              /tmp/SHA256SUMS.txt \
              /tmp/apk-info.txt \
              --repo "$PUBLIC_REPO" \
              --target main \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

          gh release view "$TAG" --repo "$PUBLIC_REPO" --json tagName,url,isLatest

      - name: Verify Downloader 3875230 is serving this exact build
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(awk '{print $1}' /tmp/SHA256SUMS.txt)"
          VERIFIED=0

          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/public-download.apk
            if curl --fail --location --retry 2 --max-time 120 \
              'https://github.com/Br174/streamflix-BV/releases/latest/download/Visionflix_BV_TV.apk' \
              --output /tmp/public-download.apk; then
              ACTUAL_SHA="$(sha256sum /tmp/public-download.apk | awk '{print $1}')"
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                VERIFIED=1
                break
              fi
            fi
            echo "Il link latest non serve ancora la build nuova; nuovo controllo tra 5 secondi..."
            sleep 5
          done

          if [ "$VERIFIED" != "1" ]; then
            echo "::error::Downloader 3875230 non sta ancora servendo l'APK appena compilato."
            exit 1
          fi

          echo "Downloader 3875230 verificato: ${APP_VERSION_NAME} build ${APP_VERSION_CODE}." >> "$GITHUB_STEP_SUMMARY"
