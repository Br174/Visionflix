          echo "[LAB158_TESTS=PASS] Director-role credits, cast order, no duplicates, focus and search regressions"

      - name: LAB159 focus navigation and nested Matrioska regression tests
        if: github.ref == 'refs/heads/lab/visionflix-lab159-dpad-matryoshka-20261024'
        env:
