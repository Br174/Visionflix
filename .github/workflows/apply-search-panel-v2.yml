name: Apply search panel v2

on:
  push:
    branches: [fix/search-panel-v2]
    paths:
      - scripts/patch_tv_panel_v2.py
      - scripts/patch_search_engine_v2.py
      - scripts/patch_mobile_filters_v2.py
      - scripts/patch_mobile_layout_v2.py
      - .github/workflows/apply-search-panel-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-panel-v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply source patches
        run: |
          python3 scripts/patch_tv_panel_v2.py
          python3 scripts/patch_search_engine_v2.py
          python3 scripts/patch_mobile_layout_v2.py
          python3 scripts/patch_mobile_filters_v2.py
      - name: Compile Mobile
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace
      - name: Compile TV
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
      - name: Commit verified production source only
        run: |
          rm -f scripts/patch_tv_panel_v2.py scripts/patch_search_engine_v2.py scripts/patch_mobile_filters_v2.py scripts/patch_mobile_layout_v2.py .github/workflows/apply-search-panel-v2.yml local.properties
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Search: pannello TV stabile e filtri Mobile allineati'
          git push origin HEAD:fix/search-panel-v2
