name: Validate focused TV search repair

on:
  push:
    branches:
      - fix/tv-search-nav-regression
    paths:
      - .github/workflows/apply-tv-search-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-search-nav-regression

      - name: Harden TV search entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt')
          text = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          one(
              'import android.text.TextWatcher\n',
              'import android.text.TextWatcher\nimport android.util.Log\n',
              'import Log',
          )
          one(
              '    private lateinit var voiceHelper: VoiceRecognitionHelper\n',
              '    private var voiceHelper: VoiceRecognitionHelper? = null\n',
              'voice helper field',
          )
          one(
              '''        initializeSearch()
          initializeAdvancedFilters()
          initializeActorSearch()
          initializeScrollableHeader()
          ''',
              '''        // L'ingresso in Cerca non deve mai chiudere l'intera Activity per un
          // sottosistema opzionale. La base e i filtri vengono isolati; attori e
          // scorrimento vengono agganciati dopo il primo frame della schermata.
          safeInit("base") { initializeSearch() }
          safeInit("filtri") { initializeAdvancedFilters() }
          view.post {
              if (_binding == null) return@post
              safeInit("attori") { initializeActorSearch() }
              safeInit("scorrimento") { initializeScrollableHeader() }
          }
          ''',
              'safe initialization',
          )
          one(
              '''        actorSearchJob?.cancel()
          if (::voiceHelper.isInitialized) voiceHelper.stopRecognition()
          super.onDestroyView()
          ''',
              '''        actorSearchJob?.cancel()
          voiceHelper?.stopRecognition()
          voiceHelper = null
          super.onDestroyView()
          ''',
              'destroy voice',
          )
          one(
              '''    private fun initializeScrollableHeader() {
          binding.searchHeader.post { updateGridTopPadding() }

          binding.vgvSearch.addOnScrollListener(object : RecyclerView.OnScrollListener() {
          ''',
              '''    private fun initializeScrollableHeader() {
          binding.vgvSearch.addOnScrollListener(object : RecyclerView.OnScrollListener() {
          ''',
              'defer header padding',
          )

          old_voice = '''        val blink = AlphaAnimation(1f, 0.3f).apply {
              duration = 500
              repeatCount = Animation.INFINITE
              repeatMode = Animation.REVERSE
          }

          voiceHelper = VoiceRecognitionHelper(
              fragment = this,
              onResult = { query ->
                  binding.btnSearchVoice.clearAnimation()
                  binding.etSearch.setText(query)
                  submitSearch()
              },
              onError = { msg ->
                  Toast.makeText(requireContext(), msg, Toast.LENGTH_SHORT).show()
                  binding.btnSearchVoice.clearAnimation()
                  binding.etSearch.hint = getString(R.string.search_input_hint)
              },
              onListeningStateChanged = {
                  binding.btnSearchVoice.startAnimation(blink)
                  binding.etSearch.hint = getString(R.string.voice_prompt)
              }
          )

          binding.btnSearchVoice.apply {
              requestFocus()
              visibility = if (voiceHelper.isAvailable()) View.VISIBLE else View.GONE
              setOnClickListener {
                  if (!voiceHelper.isListening) voiceHelper.startWithPermissionCheck()
              }
          }
          '''
          new_voice = '''        // SpeechRecognizer non viene più toccato entrando in Cerca.
          // Viene inizializzato soltanto quando l'utente preme davvero il microfono.
          binding.btnSearchVoice.apply {
              visibility = View.VISIBLE
              setOnClickListener { startVoiceSearch() }
          }
          '''
          one(old_voice, new_voice, 'lazy voice search')

          marker = '    private fun focusSearchContent(): Boolean {\n'
          helper = '''    private inline fun safeInit(stage: String, block: () -> Unit) {
              try {
                  block()
              } catch (error: Throwable) {
                  Log.e("SearchTvFragment", "TV search init failed at $stage", error)
                  if (isAdded) {
                      Toast.makeText(
                          requireContext(),
                          "Cerca: inizializzazione $stage non riuscita",
                          Toast.LENGTH_SHORT,
                      ).show()
                  }
              }
          }

          private fun startVoiceSearch() {
              val helper = voiceHelper ?: run {
                  val blink = AlphaAnimation(1f, 0.3f).apply {
                      duration = 500
                      repeatCount = Animation.INFINITE
                      repeatMode = Animation.REVERSE
                  }
                  VoiceRecognitionHelper(
                      fragment = this,
                      onResult = { query ->
                          if (_binding != null) {
                              binding.btnSearchVoice.clearAnimation()
                              binding.etSearch.setText(query)
                              submitSearch()
                          }
                      },
                      onError = { msg ->
                          if (_binding != null) {
                              Toast.makeText(requireContext(), msg, Toast.LENGTH_SHORT).show()
                              binding.btnSearchVoice.clearAnimation()
                              binding.etSearch.hint = getString(R.string.search_input_hint)
                          }
                      },
                      onListeningStateChanged = {
                          if (_binding != null) {
                              binding.btnSearchVoice.startAnimation(blink)
                              binding.etSearch.hint = getString(R.string.voice_prompt)
                          }
                      },
                  ).also { voiceHelper = it }
              }

              if (!helper.isAvailable()) {
                  binding.btnSearchVoice.visibility = View.GONE
                  return
              }
              if (!helper.isListening) helper.startWithPermissionCheck()
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit('helper insertion marker mismatch')
          text = text.replace(marker, helper + marker, 1)

          one(
              '''        appAdapter.submitList(list.onEach {
          ''',
              '''        binding.searchHeader.post {
              if (_binding != null) updateGridTopPadding()
          }

          appAdapter.submitList(list.onEach {
          ''',
              'padding after results',
          )

          p.write_text(text, encoding='utf-8')
          PY

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mobile smoke check
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Build TV smoke check
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace

      - name: Commit verified TV search repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt
          git diff --cached --check
          git commit -m 'fix: harden TV search screen entry'
          git push origin HEAD:fix/tv-search-nav-regression
