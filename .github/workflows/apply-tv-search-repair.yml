name: Validate focused TV search repair

on:
  push:
    branches:
      - fix/tv-search-nav-regression
    paths:
      - .github/workflows/apply-tv-search-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-search-nav-regression

      - name: Harden TV search entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt')
          text = p.read_text(encoding='utf-8')

          def exact(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              text = text.replace(old, new, 1)

          def regex(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: regex match count {count}')

          exact('import android.text.TextWatcher\n', 'import android.text.TextWatcher\nimport android.util.Log\n', 'Log import')
          exact('    private lateinit var voiceHelper: VoiceRecognitionHelper\n', '    private var voiceHelper: VoiceRecognitionHelper? = null\n', 'voice field')

          exact(
              '        initializeSearch()\n        initializeAdvancedFilters()\n        initializeActorSearch()\n        initializeScrollableHeader()\n',
              '        // Isola i sottosistemi opzionali: un problema locale non deve chiudere la TV.\n        safeInit("base") { initializeSearch() }\n        safeInit("filtri") { initializeAdvancedFilters() }\n        view.post {\n            if (_binding == null) return@post\n            safeInit("attori") { initializeActorSearch() }\n            safeInit("scorrimento") { initializeScrollableHeader() }\n        }\n',
              'initialization block',
          )

          exact(
              '        actorSearchJob?.cancel()\n        if (::voiceHelper.isInitialized) voiceHelper.stopRecognition()\n        super.onDestroyView()\n',
              '        actorSearchJob?.cancel()\n        voiceHelper?.stopRecognition()\n        voiceHelper = null\n        super.onDestroyView()\n',
              'destroy block',
          )

          exact(
              '    private fun initializeScrollableHeader() {\n        binding.searchHeader.post { updateGridTopPadding() }\n\n        binding.vgvSearch.addOnScrollListener(object : RecyclerView.OnScrollListener() {\n',
              '    private fun initializeScrollableHeader() {\n        binding.vgvSearch.addOnScrollListener(object : RecyclerView.OnScrollListener() {\n',
              'scroll startup',
          )

          regex(
              r'        val blink = AlphaAnimation\(1f, 0\.3f\)\.apply \{.*?\n\n        listOf\(binding\.btnSearchClear, binding\.btnSearchVoice, binding\.llGlobalSearch\)',
              '        // Il riconoscimento vocale viene creato solo al click, mai entrando in Cerca.\n        binding.btnSearchVoice.apply {\n            visibility = View.VISIBLE\n            setOnClickListener { startVoiceSearch() }\n        }\n\n        listOf(binding.btnSearchClear, binding.btnSearchVoice, binding.llGlobalSearch)',
              'lazy voice block',
          )

          marker = '    private fun focusSearchContent(): Boolean {\n'
          if text.count(marker) != 1:
              raise SystemExit('focusSearchContent marker mismatch')
          helper = '''    private inline fun safeInit(stage: String, block: () -> Unit) {
              try {
                  block()
              } catch (error: Throwable) {
                  Log.e("SearchTvFragment", "TV search init failed at $stage", error)
                  if (isAdded) {
                      Toast.makeText(
                          requireContext(),
                          "Cerca: inizializzazione $stage non riuscita",
                          Toast.LENGTH_SHORT,
                      ).show()
                  }
              }
          }

          private fun startVoiceSearch() {
              val helper = voiceHelper ?: run {
                  val blink = AlphaAnimation(1f, 0.3f).apply {
                      duration = 500
                      repeatCount = Animation.INFINITE
                      repeatMode = Animation.REVERSE
                  }
                  VoiceRecognitionHelper(
                      fragment = this,
                      onResult = { query ->
                          if (_binding != null) {
                              binding.btnSearchVoice.clearAnimation()
                              binding.etSearch.setText(query)
                              submitSearch()
                          }
                      },
                      onError = { msg ->
                          if (_binding != null) {
                              Toast.makeText(requireContext(), msg, Toast.LENGTH_SHORT).show()
                              binding.btnSearchVoice.clearAnimation()
                              binding.etSearch.hint = getString(R.string.search_input_hint)
                          }
                      },
                      onListeningStateChanged = {
                          if (_binding != null) {
                              binding.btnSearchVoice.startAnimation(blink)
                              binding.etSearch.hint = getString(R.string.voice_prompt)
                          }
                      },
                  ).also { voiceHelper = it }
              }

              if (!helper.isAvailable()) {
                  binding.btnSearchVoice.visibility = View.GONE
                  return
              }
              if (!helper.isListening) helper.startWithPermissionCheck()
          }

          '''
          text = text.replace(marker, helper + marker, 1)

          exact(
              '        appAdapter.submitList(list.onEach {\n',
              '        binding.searchHeader.post {\n            if (_binding != null) updateGridTopPadding()\n        }\n\n        appAdapter.submitList(list.onEach {\n',
              'result padding',
          )

          p.write_text(text, encoding='utf-8')
          PY

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mobile smoke check
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Build TV smoke check
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace

      - name: Commit verified TV search repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt
          git diff --cached --check
          git commit -m 'fix: harden TV search screen entry'
          git push origin HEAD:fix/tv-search-nav-regression
