name: Verify TV panel persistence

on:
  push:
    branches:
      - fix/tv-panel-persistence-work3
    paths:
      - scripts/patch_tv_panel_persistence.py
      - .github/workflows/apply-tv-panel-persistence.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tv-panel-persistence-work3
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply patch
        run: python3 scripts/patch_tv_panel_persistence.py

      - name: Compile Mobile
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Compile TV
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace

      - name: Commit verified production source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchMobileFragment.kt \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchFilterPersistence.kt
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
          else
            git commit -m 'Search: TV panel a scomparsa stabile e filtri persistenti'
            git push origin HEAD:fix/tv-panel-persistence-work3
          fi
