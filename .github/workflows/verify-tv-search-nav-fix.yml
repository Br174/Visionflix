name: Verify TV search and navigation repair

on:
  push:
    branches:
      - fix/tv-search-nav-regression

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-search-nav-regression

      - name: Apply focused TV regression repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1) Restore the original NavigationSlideView behavior while keeping the
          #    outer TV window fullscreen and with zero overscan padding.
          layout = Path('app/src/main/res/layout/activity_main_tv.xml')
          layout.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              xmlns:tools="http://schemas.android.com/tools"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="?attr/app_background_color"
              tools:context=".activities.main.MainTvActivity"
              tools:deviceIds="tv"
              tools:ignore="MergeRootFrame">

              <com.tanasi.navigation.widget.NavigationSlideView
                  android:id="@+id/nav_main"
                  android:layout_width="wrap_content"
                  android:layout_height="0dp"
                  android:paddingStart="10dp"
                  android:paddingEnd="10dp"
                  android:background="?attr/app_background_color"
                  app:headerLayout="@layout/content_header_menu_main_tv"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent"
                  app:menu="@menu/menu_main_activity_tv"
                  app:menuGravity="center"
                  app:menuSpacing="8dp" />

              <androidx.fragment.app.FragmentContainerView
                  android:id="@+id/nav_main_fragment"
                  android:name="androidx.navigation.fragment.NavHostFragment"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:background="?attr/app_background_color"
                  app:defaultNavHost="true"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toEndOf="@id/nav_main"
                  app:layout_constraintTop_toTopOf="parent"
                  app:navGraph="@navigation/nav_main_graph_tv" />

              <ImageView
                  android:id="@+id/iv_splash_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="?android:attr/windowBackground"
                  android:clickable="true"
                  android:focusable="true"
                  android:visibility="visible"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          '''.replace('          ', ''), encoding='utf-8')

          activity = Path('app/src/main/java/com/streamflixreborn/streamflix/activities/main/MainTvActivity.kt')
          text = activity.read_text(encoding='utf-8')
          text = text.replace('import android.graphics.Color\n', '')
          text = replace_once(text, '''                // Quando il menu è chiuso non deve esistere una fascia laterale opaca.
                setBackgroundColor(Color.TRANSPARENT)
                setOnOpenListener {
                    setBackgroundColor(palette.tvNavBackground)
                    header.tvNavigationHeaderTitle.visibility = View.VISIBLE
                    header.tvNavigationHeaderSubtitle.visibility = View.VISIBLE
                }
                setOnCloseListener {
                    setBackgroundColor(Color.TRANSPARENT)
                    header.tvNavigationHeaderTitle.visibility = View.GONE
                    header.tvNavigationHeaderSubtitle.visibility = View.GONE
                }
''', '''                // Comportamento grafico originale: il pannello laterale resta pieno
                // e, aprendosi, ridimensiona/sposta il contenuto verso destra.
                setBackgroundColor(palette.tvNavBackground)
                setOnOpenListener {
                    header.tvNavigationHeaderTitle.visibility = View.VISIBLE
                    header.tvNavigationHeaderSubtitle.visibility = View.VISIBLE
                }
                setOnCloseListener {
                    header.tvNavigationHeaderTitle.visibility = View.GONE
                    header.tvNavigationHeaderSubtitle.visibility = View.GONE
                }
''', 'MainTvActivity navigation listeners')
          text = replace_once(text, '''        // Il menu TV resta sovrapposto al contenuto, senza creare una colonna laterale.
        binding.navMain.setBackgroundColor(Color.TRANSPARENT)
        binding.navMain.headerView?.let { headerView ->
            headerView.setBackgroundColor(Color.TRANSPARENT)
''', '''        // Ripristina la cromia e il comportamento originali del pannello TV.
        binding.navMain.setBackgroundColor(palette.tvNavBackground)
        binding.navMain.headerView?.let { headerView ->
            headerView.setBackgroundColor(palette.tvNavBackground)
''', 'MainTvActivity navigation chrome')
          activity.write_text(text, encoding='utf-8')

          # 2) Harden SearchTvFragment entry. Enhanced filters remain enabled, but
          #    no optional subsystem is allowed to take down the whole Activity.
          search = Path('app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt')
          text = search.read_text(encoding='utf-8')
          text = replace_once(text, 'import android.text.TextWatcher\n', 'import android.text.TextWatcher\nimport android.util.Log\n', 'Search import Log')
          text = replace_once(text, '    private lateinit var voiceHelper: VoiceRecognitionHelper\n', '    private var voiceHelper: VoiceRecognitionHelper? = null\n', 'Search voice helper field')
          text = replace_once(text, '''        initializeSearch()
        initializeAdvancedFilters()
        initializeActorSearch()
        initializeScrollableHeader()
''', '''        // Ogni blocco aggiuntivo è isolato: su TV/Fire OS un errore in un
        // controllo opzionale non deve più chiudere l'intera applicazione.
        safeInit("base") { initializeSearch() }
        safeInit("filtri") { initializeAdvancedFilters() }
        safeInit("attori") { initializeActorSearch() }
        safeInit("scorrimento") { initializeScrollableHeader() }
''', 'Search safe initialization')
          text = replace_once(text, '''        actorSearchJob?.cancel()
        if (::voiceHelper.isInitialized) voiceHelper.stopRecognition()
        super.onDestroyView()
''', '''        actorSearchJob?.cancel()
        voiceHelper?.stopRecognition()
        voiceHelper = null
        super.onDestroyView()
''', 'Search destroy voice')
          text = replace_once(text, '''    private fun initializeScrollableHeader() {
        binding.searchHeader.post { updateGridTopPadding() }

        binding.vgvSearch.addOnScrollListener(object : RecyclerView.OnScrollListener() {
''', '''    private fun initializeScrollableHeader() {
        // Il padding viene calcolato solo quando ci sono risultati reali.
        // Evita lavoro/relayout aggressivo proprio durante l'ingresso in Cerca.
        binding.vgvSearch.addOnScrollListener(object : RecyclerView.OnScrollListener() {
''', 'Search scroll startup')

          old_voice = '''        val blink = AlphaAnimation(1f, 0.3f).apply {
            duration = 500
            repeatCount = Animation.INFINITE
            repeatMode = Animation.REVERSE
        }

        voiceHelper = VoiceRecognitionHelper(
            fragment = this,
            onResult = { query ->
                binding.btnSearchVoice.clearAnimation()
                binding.etSearch.setText(query)
                submitSearch()
            },
            onError = { msg ->
                Toast.makeText(requireContext(), msg, Toast.LENGTH_SHORT).show()
                binding.btnSearchVoice.clearAnimation()
                binding.etSearch.hint = getString(R.string.search_input_hint)
            },
            onListeningStateChanged = {
                binding.btnSearchVoice.startAnimation(blink)
                binding.etSearch.hint = getString(R.string.voice_prompt)
            }
        )

        binding.btnSearchVoice.apply {
            requestFocus()
            visibility = if (voiceHelper.isAvailable()) View.VISIBLE else View.GONE
            setOnClickListener {
                if (!voiceHelper.isListening) voiceHelper.startWithPermissionCheck()
            }
        }
'''
          new_voice = '''        // Non inizializzare SpeechRecognizer entrando nella schermata.
        // Su alcuni TV/Fire OS viene toccato solo quando l'utente preme davvero il microfono.
        binding.btnSearchVoice.apply {
            visibility = View.VISIBLE
            setOnClickListener { startVoiceSearch() }
        }
'''
          text = replace_once(text, old_voice, new_voice, 'Search lazy voice')

          marker = '''    private fun focusSearchContent(): Boolean {
'''
          helper = '''    private inline fun safeInit(stage: String, block: () -> Unit) {
        try {
            block()
        } catch (error: Throwable) {
            Log.e("SearchTvFragment", "TV search init failed at $stage", error)
            if (isAdded) {
                Toast.makeText(
                    requireContext(),
                    "Cerca: inizializzazione $stage non riuscita",
                    Toast.LENGTH_SHORT,
                ).show()
            }
        }
    }

    private fun startVoiceSearch() {
        val helper = voiceHelper ?: run {
            val blink = AlphaAnimation(1f, 0.3f).apply {
                duration = 500
                repeatCount = Animation.INFINITE
                repeatMode = Animation.REVERSE
            }
            VoiceRecognitionHelper(
                fragment = this,
                onResult = { query ->
                    if (_binding == null) return@VoiceRecognitionHelper
                    binding.btnSearchVoice.clearAnimation()
                    binding.etSearch.setText(query)
                    submitSearch()
                },
                onError = { msg ->
                    if (_binding == null) return@VoiceRecognitionHelper
                    Toast.makeText(requireContext(), msg, Toast.LENGTH_SHORT).show()
                    binding.btnSearchVoice.clearAnimation()
                    binding.etSearch.hint = getString(R.string.search_input_hint)
                },
                onListeningStateChanged = {
                    if (_binding == null) return@VoiceRecognitionHelper
                    binding.btnSearchVoice.startAnimation(blink)
                    binding.etSearch.hint = getString(R.string.voice_prompt)
                },
            ).also { voiceHelper = it }
        }

        if (!helper.isAvailable()) {
            binding.btnSearchVoice.visibility = View.GONE
            return
        }
        if (!helper.isListening) helper.startWithPermissionCheck()
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('Search helper insertion marker mismatch')
          text = text.replace(marker, helper + marker, 1)

          text = replace_once(text, '''        appAdapter.submitList(list.onEach {
''', '''        binding.searchHeader.post {
            if (_binding != null) updateGridTopPadding()
        }

        appAdapter.submitList(list.onEach {
''', 'Search update padding on results')
          search.write_text(text, encoding='utf-8')
          PY

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mobile smoke check
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Build TV smoke check
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace

      - name: Commit verified repair to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/layout/activity_main_tv.xml \
                  app/src/main/java/com/streamflixreborn/streamflix/activities/main/MainTvActivity.kt \
                  app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt
          git diff --cached --check
          git commit -m '[auto-fix] fix: restore original TV navigation and harden search entry'
          git push origin HEAD:fix/tv-search-nav-regression
