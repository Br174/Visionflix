name: Validate TV search entry crash fix v2

on:
  push:
    branches:
      - fix/tv-search-entry-crash-v2
    paths:
      - .github/workflows/validate-tv-search-entry-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-search-entry-crash-v2

      - name: Apply focused search-entry hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          vm = Path('app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchViewModel.kt')
          s = vm.read_text()
          old = 'private val _state = MutableStateFlow<State>(State.Searching)'
          new = 'private val _state = MutableStateFlow<State>(State.SuccessSearching(emptyList(), hasMore = false))'
          if old not in s:
              raise SystemExit('SearchViewModel state anchor not found')
          s = s.replace(old, new, 1)
          init_block = '''    init {\n        search(query)\n    }\n\n'''
          if init_block not in s:
              raise SystemExit('SearchViewModel init anchor not found')
          s = s.replace(init_block, '', 1)
          vm.write_text(s)

          frag = Path('app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt')
          s = frag.read_text()
          import_anchor = 'import kotlinx.coroutines.Job\n'
          if import_anchor not in s:
              raise SystemExit('Coroutine import anchor not found')
          s = s.replace(import_anchor, import_anchor + 'import kotlinx.coroutines.CoroutineExceptionHandler\n', 1)

          field_anchor = '    private var searchHeaderOffset: Int = 0\n'
          handler = '''    private var searchHeaderOffset: Int = 0\n\n    private val searchUiExceptionHandler = CoroutineExceptionHandler { _, error ->\n        Log.e("SearchTvFragment", "TV search coroutine failed", error)\n        activity?.runOnUiThread {\n            if (isAdded) {\n                Toast.makeText(\n                    requireContext(),\n                    "Cerca: errore isolato, la schermata resta aperta",\n                    Toast.LENGTH_SHORT,\n                ).show()\n            }\n        }\n    }\n'''
          if field_anchor not in s:
              raise SystemExit('SearchTvFragment field anchor not found')
          s = s.replace(field_anchor, handler, 1)

          launch_anchor = '        viewLifecycleOwner.lifecycleScope.launch {\n            viewModel.state.flowWithLifecycle'
          if launch_anchor not in s:
              raise SystemExit('state collector launch anchor not found')
          s = s.replace(
              launch_anchor,
              '        viewLifecycleOwner.lifecycleScope.launch(searchUiExceptionHandler) {\n            viewModel.state.flowWithLifecycle',
              1,
          )
          actor_anchor = '        viewLifecycleOwner.lifecycleScope.launch {\n            viewModel.actorSuggestions'
          if actor_anchor not in s:
              raise SystemExit('actor collector launch anchor not found')
          s = s.replace(
              actor_anchor,
              '        viewLifecycleOwner.lifecycleScope.launch(searchUiExceptionHandler) {\n            viewModel.actorSuggestions',
              1,
          )

          old_display = '''        binding.vgvSearch.setNumColumns(currentGridColumns)\n        binding.vgvSearch.nextFocusUpId = binding.btnApplyFilters.id\n\n        binding.searchHeader.post {\n            if (_binding != null) updateGridTopPadding()\n        }\n'''
          new_display = '''        binding.vgvSearch.post {\n            if (_binding == null) return@post\n            binding.vgvSearch.setNumColumns(currentGridColumns)\n            binding.vgvSearch.nextFocusUpId = binding.btnApplyFilters.id\n            updateGridTopPadding()\n        }\n'''
          if old_display not in s:
              raise SystemExit('displaySearch layout anchor not found')
          s = s.replace(old_display, new_display, 1)

          old_global = '''        currentGridColumns = 1\n        binding.vgvSearch.setNumColumns(currentGridColumns)\n        appAdapter.submitList(categories)\n'''
          new_global = '''        currentGridColumns = 1\n        binding.vgvSearch.post {\n            if (_binding != null) binding.vgvSearch.setNumColumns(currentGridColumns)\n        }\n        appAdapter.submitList(categories)\n'''
          if old_global not in s:
              raise SystemExit('displayGlobalSearch layout anchor not found')
          s = s.replace(old_global, new_global, 1)
          frag.write_text(s)
          PY

          git diff --check
          git diff -- app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchViewModel.kt app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Mobile smoke check
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace

      - name: Build TV smoke check
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace

      - name: Commit verified fix to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchViewModel.kt app/src/main/java/com/streamflixreborn/streamflix/fragments/search/SearchTvFragment.kt
          git commit -m 'fix: make TV search open before provider work'
          git push origin HEAD:fix/tv-search-entry-crash-v2
