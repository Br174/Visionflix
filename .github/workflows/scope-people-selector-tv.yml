name: Scope people selector callback to TV

on:
  push:
    branches:
      - fix/tv-filter-panel-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tv-filter-panel-v2
      - run: python3 scripts/scope_people_selector_to_tv.py
      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/streamflixreborn/streamflix/adapters/AppAdapter.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep people selection callback TV-only'
          git push origin HEAD:fix/tv-filter-panel-v2
