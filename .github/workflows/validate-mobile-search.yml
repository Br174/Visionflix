name: Validate mobile search branch

on:
  push:
    branches:
      - fix/mobile-search-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile mobile debug APK
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy
          SUBDL_API_KEY=dummy
          RABBITSTREAM_SOURCE_API=
          EOF
          ./gradlew clean assembleDebug --stacktrace
